name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Sadece v ile başlayan etiketlerde çalışır (örn: v1.0, v1.1)
  workflow_dispatch: # Manuel olarak tetikleyebilmeniz için

jobs:
  build:
    runs-on: ubuntu-latest
    
    # İzinler release upload etmek için gereklidir
    permissions:
      contents: write

    steps:
      - name: Kodu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle'a Çalıştırma İzni Ver
        run: chmod +x gradlew

      - name: Release APK Derle
        run: ./gradlew assembleRelease

      - name: APK'yı İmzala
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: GitHub Release'e Yükle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{steps.sign_app.outputs.signedReleaseFile}}
          # Eğer APK imzalama adımını şimdilik atlamak isterseniz, üstteki "APK'yı İmzala"
          # adımını silin veya yorum satırı yapın, ardından "files:" kısmını aşağıdaki gibi değiştirin:
          # files: app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
